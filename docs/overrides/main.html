{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="theme-color" content="#0B0D0E">
  <meta name="description" content="Explore the existing Zero2Root cybersecurity learning paths, lessons, tools and resources through an interactive radial content map.">
  <meta property="og:title" content="Zero2Root — Cybersecurity, mapped">
  <meta property="og:description" content="Explore the existing Zero2Root learning library: five learning levels, technical lessons, tools and resources.">
{% endblock %}

{# The home page is the interactive index itself; no separate marketing hero. #}
{% block hero %}{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if page and page.is_homepage %}
    <script src="{{ 'assets/javascripts/home-map.js' | url }}" defer data-library-map></script>
  {% endif %}
{% endblock %}
