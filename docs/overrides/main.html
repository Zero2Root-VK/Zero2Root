{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="theme-color" content="#0B0D0E">
  <meta name="description" content="Explore Zero2Root learning paths, AI model intelligence, offensive-security skills, payload references and bug bounty research through an interactive knowledge map.">
  <meta property="og:title" content="Zero2Root — Cybersecurity, mapped">
  <meta property="og:description" content="Explore the public Zero2Root cybersecurity intelligence hub: AI models, benchmarks, offensive-security skills, testing references and research.">
{% endblock %}

{# The home page is the interactive index itself; no separate marketing hero. #}
{% block hero %}{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if page and page.is_homepage %}
    <script src="{{ 'assets/javascripts/home-map.js' | url }}" defer data-library-map></script>
  {% endif %}
{% endblock %}
